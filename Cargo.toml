[package]
name = "active-work"
version = "0.1.0"
edition = "2024"
description = "A small cue board for active work"
license = "MIT"

[[bin]]
name = "aw"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
tiny_http = "0.12"
